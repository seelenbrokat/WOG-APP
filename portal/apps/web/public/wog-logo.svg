<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="WOG World of Green Logistics">
  <defs>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8D0E8"/>
      <stop offset="100%" stop-color="#7AADCF"/>
    </linearGradient>
  </defs>

  <!-- W -->
  <text x="8" y="108" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="#1B7340">W</text>

  <!-- Globe as O -->
  <g transform="translate(118,22)">
    <path d="M-18 78 C10 102, 118 102, 146 78" fill="none" stroke="#8AB8D9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="64" cy="72" r="52" fill="url(#globe)" stroke="#1B7340" stroke-width="4"/>
    <!-- longitude -->
    <ellipse cx="64" cy="72" rx="22" ry="50" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
    <line x1="64" y1="22" x2="64" y2="122" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
    <!-- latitude -->
    <ellipse cx="64" cy="72" rx="50" ry="18" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
    <path d="M20 55 Q64 42 108 55" fill="none" stroke="#fff" stroke-width="2" opacity="0.75"/>
    <path d="M20 90 Q64 103 108 90" fill="none" stroke="#fff" stroke-width="2" opacity="0.75"/>
    <!-- leaves -->
    <path d="M92 18 C108 2, 126 8, 128 24 C112 22, 100 28, 92 18Z" fill="#1B7340"/>
    <path d="M104 28 C118 16, 136 24, 134 40 C120 34, 110 38, 104 28Z" fill="#155C33"/>
  </g>

  <!-- G -->
  <text x="250" y="108" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="#1B7340">G</text>

  <!-- Wordmark -->
  <text x="260" y="160" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#1B7340">WORLD OF GREEN</text>
  <text x="260" y="196" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#8AB8D9">LOGISTICS</text>
</svg>
