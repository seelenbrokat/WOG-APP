services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wog
      POSTGRES_PASSWORD: wog_secret
      POSTGRES_DB: wog_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wog -d wog_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wog:wog_secret@postgres:5432/wog_portal?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
      SFTP_INBOUND_DIR: /app/data/sftp/inbound
      SFTP_OUTBOUND_DIR: /app/data/sftp/outbound
      API_PORT: 3001
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/sftp:/app/data/sftp
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wog:wog_secret@postgres:5432/wog_portal?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
      SFTP_INBOUND_DIR: /app/data/sftp/inbound
      SFTP_OUTBOUND_DIR: /app/data/sftp/outbound
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/sftp:/app/data/sftp
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      target: web
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - api

  sftpgo:
    image: drakkan/sftpgo:v2
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: admin
      SFTPGO_DEFAULT_ADMIN_PASSWORD: admin_change_me
    volumes:
      - ./data/sftp:/srv/sftpgo/data
      - sftpgo_data:/var/lib/sftpgo
    ports:
      - "2022:2022"
      - "8080:8080"

volumes:
  postgres_data:
  sftpgo_data:
