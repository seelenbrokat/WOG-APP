# Ports nur auf localhost – bestehende öffentliche Dienste bleiben unberührt.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wog
      POSTGRES_PASSWORD: wog_secret
      POSTGRES_DB: wog_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wog -d wog_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wog:wog_secret@postgres:5432/wog_portal?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
      SFTP_INBOUND_DIR: /app/data/sftp/inbound
      SFTP_OUTBOUND_DIR: /app/data/sftp/outbound
      API_PORT: 3001
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/sftp:/app/data/sftp
      - ./data/integrations:/app/data/integrations
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wog:wog_secret@postgres:5432/wog_portal?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
      SFTP_INBOUND_DIR: /app/data/sftp/inbound
      SFTP_OUTBOUND_DIR: /app/data/sftp/outbound
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/sftp:/app/data/sftp
      - ./data/integrations:/app/data/integrations
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # Intouch/Soloplan-Uploads: OpenSSH :22 ist primär; SFTPGo nur localhost (kein öffentliches Bind).
  # Ohne Profil, damit Teil-Deploys (api/web) den Dienst nicht „vergessen“.
  sftpgo:
    image: drakkan/sftpgo:v2
    restart: unless-stopped
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: admin
      # Kein schwaches Default – Deploy setzt SFTPGO_ADMIN_PASSWORD in .env
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?SFTPGO_ADMIN_PASSWORD muss in .env gesetzt sein}
      # Home der User liegt unter /srv/sftpgo/data (gemountetes ./data/sftp)
      SFTPGO_COMMON__PROXY_PROTOCOL: 0
    volumes:
      - ./data/sftp:/srv/sftpgo/data
      - sftpgo_data:/var/lib/sftpgo
    ports:
      # Nur localhost – Soloplan/Intouch nutzen primär OpenSSH :22
      - "127.0.0.1:12022:2022"
      - "127.0.0.1:18080:8080"

volumes:
  postgres_data:
  sftpgo_data:
